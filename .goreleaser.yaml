version: 2
project_name: gocpp

builds:
  - id: gocpp-validate
    main: ./cmd/gocpp-validate
    binary: gocpp-validate
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
  - id: gocpp-sim
    main: ./cmd/gocpp-sim
    binary: gocpp-sim
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
  - id: gocpp-csms
    main: ./cmd/gocpp-csms
    binary: gocpp-csms
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
  # The gateway tools are separate modules (cmd/*/go.mod) that build against
  # this checkout through their replace directives.
  - id: gocpp-gateway
    dir: cmd/gocpp-gateway
    main: .
    binary: gocpp-gateway
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
  - id: gocppctl
    dir: cmd/gocppctl
    main: .
    binary: gocppctl
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  # One archive per platform with the tools built for every platform; the
  # gateway is not built for Windows, so it ships in its own archive.
  - id: default
    ids: [gocpp-validate, gocpp-sim, gocpp-csms, gocppctl]
    format_overrides:
      - goos: windows
        formats: [zip]

  - id: gateway
    ids: [gocpp-gateway]
    name_template: "gocpp-gateway_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: shiv3
    name: gocpp
