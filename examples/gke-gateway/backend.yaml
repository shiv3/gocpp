# The processing tier: any application built with csms.WithGatewayLink and
# linkgrpc.NewBackend(linkgrpc.DNSTargets("gateway-link", "9090"), ...).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 3
  strategy:
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}   # a backend deploy disconnects nobody
  selector:
    matchLabels: {app: backend, pool: default}
  template:
    metadata:
      labels: {app: backend, pool: default}
    spec:
      terminationGracePeriodSeconds: 60   # above the link drain timeout
      containers:
        - name: backend
          image: example.invalid/my-csms-backend:v1
          env:
            - {name: GOCPP_POOL, value: default}
            - {name: GOCPP_GATEWAYS, value: "gateway-link:9090"}
---
# Optional canary: attaches with pool "canary". It receives no inbound work until a
# gateway router (csms.WithRouter) names the pool; it can issue calls at once.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-canary
spec:
  replicas: 1
  selector:
    matchLabels: {app: backend, pool: canary}
  template:
    metadata:
      labels: {app: backend, pool: canary}
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: backend
          image: example.invalid/my-csms-backend:v2
          env:
            - {name: GOCPP_POOL, value: canary}
            - {name: GOCPP_GATEWAYS, value: "gateway-link:9090"}
